<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Scouting Reports</title>
    <style>
        :root {
            --gold: #b8860b;
            --gold-bright: #d4af37;
            --gold-pale: #f5e6bf;
            --ink: #1c1c1e;
            --muted: #6b6b70;
            --bg: #faf8f3;
            --card: #ffffff;
            --border: #e8e2d0;
        }
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--ink);
            max-width: 900px;
            margin: 0 auto;
            padding: 32px 24px 60px;
            line-height: 1.5;
        }
        a { color: var(--gold); }
        header.site {
            display: flex; align-items: baseline; justify-content: space-between;
            border-bottom: 2px solid var(--gold-bright); padding-bottom: 14px; margin-bottom: 28px;
        }
        header.site h1 { font-size: 1.5rem; margin: 0; letter-spacing: 0.3px; }
        header.site h1 a { color: var(--ink); text-decoration: none; }
        header.site h1 a span { color: var(--gold); }
        header.site .subtitle { color: var(--muted); font-size: 0.9rem; }
        form.search { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 24px; }
        input[type=text] {
            flex: 1; min-width: 220px; padding: 12px 14px; border-radius: 10px;
            border: 1.5px solid var(--border); background: var(--card); color: var(--ink); font-size: 1rem;
        }
        input[type=text]:focus { outline: none; border-color: var(--gold-bright); }
        select {
            padding: 12px 14px; border-radius: 10px; border: 1.5px solid var(--border);
            background: var(--card); color: var(--ink); font-size: 0.95rem;
        }
        button {
            padding: 12px 22px; border-radius: 10px; border: none;
            background: linear-gradient(135deg, var(--gold-bright), var(--gold));
            color: #fff; font-weight: 600; font-size: 1rem; cursor: pointer;
            box-shadow: 0 2px 8px rgba(184,134,11,0.25);
        }
        button:hover { filter: brightness(1.05); }
        .card {
            background: var(--card); border: 1px solid var(--border); border-radius: 16px;
            padding: 28px 32px; box-shadow: 0 2px 16px rgba(0,0,0,0.04);
        }
        .card h2 {
            font-size: 1rem; text-transform: uppercase; letter-spacing: 0.6px;
            color: var(--gold); border-bottom: 1px solid var(--border);
            padding-bottom: 6px; margin-top: 28px; margin-bottom: 10px;
        }
        .card hr { border: none; border-top: 1px solid var(--border); margin: 24px 0 14px; }
        .card em { color: var(--muted); font-size: 0.85rem; }
        ul.results { list-style: none; padding: 0; }
        ul.results li { margin-bottom: 8px; }
        ul.results a {
            display: block; padding: 12px 16px; background: var(--card); border: 1px solid var(--border);
            border-radius: 10px; color: var(--ink); text-decoration: none; transition: border-color 0.15s;
        }
        ul.results a:hover { border-color: var(--gold-bright); }
        .back-link { display: inline-block; margin-top: 22px; color: var(--gold); text-decoration: none; font-weight: 500; }
        .error { color: #b3261e; }
        .pill {
            display: inline-block; background: var(--gold-pale); color: #7a5c00;
            border-radius: 999px; padding: 3px 12px; font-size: 0.8rem; font-weight: 600; margin-right: 6px;
        }
    </style>
</head>
<body>
    <header class="site">
        <h1><a href="/">Scouting<span>Reports</span></a></h1>
        <span class="subtitle">Premier League &middot; 2024-2025</span>
    </header>
    {% block content %}{% endblock %}
</body>
</html>
