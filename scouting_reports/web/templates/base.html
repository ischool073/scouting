<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Scouting Reports{% endblock %}</title>
    <style>
        :root {
            --accent: #ccff00;       /* vivid lime -- used as a fill (buttons, bars, badges) with dark text on top */
            --accent-dim: #6b9b00;   /* deeper green -- used as text/links on light backgrounds for real contrast */
            --ink: #16181d;
            --muted: #6b7280;
            --bg: #f7f8fa;
            --card: #ffffff;
            --card-alt: #f1f3f5;
            --border: #e3e5e9;
            --sidebar-w: 230px;
        }
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
            background: var(--bg);
            color: var(--ink);
            margin: 0;
            line-height: 1.5;
        }
        a { color: var(--accent-dim); text-decoration: none; }
        a:hover { text-decoration: underline; }

        /* --- App shell: left sidebar + main area --- */
        .app-shell { display: flex; min-height: 100vh; }
        .sidebar {
            width: var(--sidebar-w); flex-shrink: 0; background: var(--card);
            border-right: 1px solid var(--border); padding: 20px 14px; position: sticky; top: 0;
            height: 100vh; overflow-y: auto;
        }
        .sidebar .brand {
            font-size: 1.15rem; font-weight: 800; letter-spacing: -0.5px; text-transform: uppercase;
            color: var(--ink); text-decoration: none; display: block; margin-bottom: 22px; padding: 0 8px;
        }
        .sidebar .brand span { color: var(--accent-dim); }
        .sidebar nav a, .sidebar nav .disabled {
            display: block; padding: 9px 10px; border-radius: 6px; font-size: 0.85rem; font-weight: 600;
            color: var(--muted); margin-bottom: 2px;
        }
        .sidebar nav a:hover { background: var(--card-alt); color: var(--ink); text-decoration: none; }
        .sidebar nav a.active { background: var(--card-alt); color: var(--ink); }
        .sidebar nav .disabled { color: #c3c7cd; cursor: default; }
        .sidebar nav .section-gap { height: 14px; }

        .main-area { flex: 1; min-width: 0; }
        .topbar {
            background: var(--card); border-bottom: 1px solid var(--border);
            position: sticky; top: 0; z-index: 10;
            padding: 14px 32px; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
        }
        .topbar .topbar-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .topbar-actions button, .topbar-actions .btn {
            padding: 9px 16px; font-size: 0.82rem;
        }
        .topbar-actions .btn.disabled {
            background: var(--card-alt); color: #b9bec7; border: 1px solid var(--border); cursor: default;
        }
        @media (max-width: 900px) {
            .app-shell { flex-direction: column; }
            .sidebar { width: 100%; height: auto; position: static; border-right: none; border-bottom: 1px solid var(--border); }
        }

        .page { max-width: 1440px; margin: 0 auto; padding: 24px 32px 60px; }
        @media (max-width: 700px) {
            .page { padding: 16px 16px 40px; }
            .topbar { padding: 12px 16px; }
        }
        .hero { padding: 24px 0 28px; }
        .hero h1 { font-size: 2.2rem; font-weight: 800; letter-spacing: -1px; margin: 0 0 8px; text-transform: uppercase; }
        .hero h1 span { color: var(--accent-dim); }
        .hero p.lede { color: var(--muted); font-size: 1rem; max-width: 560px; margin: 0 0 28px; }
        form.search { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 24px; }
        input[type=text] {
            flex: 1; min-width: 220px; padding: 13px 16px; border-radius: 4px;
            border: 1.5px solid var(--border); background: var(--card); color: var(--ink); font-size: 1rem;
        }
        input[type=text]:focus { outline: none; border-color: var(--accent); }
        select {
            padding: 13px 16px; border-radius: 4px; border: 1.5px solid var(--border);
            background: var(--card); color: var(--ink); font-size: 0.95rem;
        }
        button, .btn {
            padding: 13px 26px; border-radius: 4px; border: none;
            background: var(--accent); color: var(--ink); font-weight: 800; font-size: 0.95rem; cursor: pointer;
            text-transform: uppercase; letter-spacing: 0.4px; display: inline-block;
        }
        button:hover, .btn:hover { filter: brightness(0.92); text-decoration: none; }
        .card {
            background: var(--card); border: 1px solid var(--border); border-radius: 8px;
            padding: 28px 32px; box-shadow: 0 1px 3px rgba(16, 24, 40, 0.06);
        }
        .card h2 {
            font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px;
            color: var(--accent-dim); border-bottom: 1px solid var(--border);
            padding-bottom: 8px; margin-top: 30px; margin-bottom: 12px;
        }
        .card hr { border: none; border-top: 1px solid var(--border); margin: 24px 0 14px; }
        .card em { color: var(--muted); font-size: 0.85rem; }
        ul.results { list-style: none; padding: 0; }
        ul.results li { margin-bottom: 8px; }
        ul.results a {
            display: block; padding: 12px 16px; background: var(--card); border: 1px solid var(--border);
            border-radius: 4px; color: var(--ink); text-decoration: none; transition: border-color 0.15s;
        }
        ul.results a:hover { border-color: var(--accent); text-decoration: none; }
        .back-link { display: inline-block; margin-top: 22px; color: var(--accent-dim); font-weight: 600; }
        .error { color: #c0392b; }
        .pill {
            display: inline-block; background: var(--card-alt); border: 1px solid var(--border); color: var(--ink);
            border-radius: 3px; padding: 3px 12px; font-size: 0.78rem; font-weight: 700; margin-right: 6px;
            text-transform: uppercase; letter-spacing: 0.3px;
        }
        .stat-value { font-family: "SF Mono", Consolas, monospace; font-weight: 700; }
        table.browse { width: 100%; border-collapse: collapse; }
        table.browse th {
            text-align: left; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px;
            color: var(--muted); border-bottom: 1px solid var(--border); padding: 10px 8px;
        }
        table.browse td { padding: 10px 8px; border-bottom: 1px solid var(--border); }
        table.browse tr:hover td { background: var(--card-alt); }
        .source-links a {
            display: inline-block; margin-right: 10px; padding: 6px 14px; border: 1px solid var(--border);
            border-radius: 4px; color: var(--ink); font-size: 0.8rem; font-weight: 600;
        }
        .source-links a:hover { border-color: var(--accent-dim); color: var(--accent-dim); text-decoration: none; }

        .layout-2col { display: grid; grid-template-columns: 340px 1fr; gap: 28px; align-items: start; }
        .hero-2col { display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 48px; align-items: center; }
        @media (max-width: 900px) {
            .layout-2col, .hero-2col { grid-template-columns: 1fr; }
        }
        .stat-highlight {
            background: var(--card); border: 1px solid var(--border); border-radius: 8px;
            padding: 24px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px;
        }
        .stat-highlight .item { border-left: 3px solid var(--accent); padding-left: 14px; }
        .stat-highlight .item .num { font-size: 1.8rem; font-weight: 800; font-family: "SF Mono", Consolas, monospace; }
        .stat-highlight .item .lbl { color: var(--muted); font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.4px; }
        .comp-badge { display: flex; align-items: center; gap: 9px; }
        .comp-badge .crest {
            width: 30px; height: 30px; border-radius: 50%; background: var(--accent); color: var(--ink);
            display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 0.7rem;
            flex-shrink: 0;
        }
        .comp-badge .meta { font-size: 0.72rem; color: var(--muted); line-height: 1.3; }
        .comp-badge .meta strong { display: block; color: var(--ink); font-size: 0.82rem; font-weight: 700; }
        .unavailable {
            border: 1.5px dashed var(--border); border-radius: 8px; padding: 20px;
            display: flex; align-items: center; justify-content: center; text-align: center;
            color: var(--muted); font-size: 0.78rem; min-height: 120px; background: var(--card-alt);
        }
    </style>
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar">
            <a class="brand" href="/">Scouting<span>Reports</span></a>
            <nav>
                <a href="/" class="{{ 'active' if active_page == 'home' else '' }}">Overview</a>
                <a href="/players" class="{{ 'active' if active_page == 'players' else '' }}">Browse Players</a>
                <a href="/compare" class="{{ 'active' if active_page == 'compare' else '' }}">Compare</a>
                <div class="section-gap"></div>
                <span class="disabled">Match Logs</span>
                <span class="disabled">Career</span>
                <span class="disabled">Similar Players</span>
                <span class="disabled">Suggestions</span>
                <span class="disabled">Alerts</span>
            </nav>
        </aside>
        <div class="main-area">
            <div class="topbar">
                <form action="/search" method="get" style="display:flex; flex:1; max-width:420px; margin:0;">
                    <input type="text" name="player" placeholder="Search a player, e.g. Salah" style="min-width:0;">
                </form>
                <div class="topbar-actions">
                    <a class="btn" href="/compare">&#8644; Compare</a>
                    <span class="btn disabled">+ Add to list</span>
                    <span class="btn disabled">&#128196; PDF Report</span>
                    {% block topbar_extra %}{% endblock %}
                </div>
            </div>
            <div class="page">
                {% block content %}{% endblock %}
            </div>
        </div>
    </div>
</body>
</html>
