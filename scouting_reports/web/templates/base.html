<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Scouting Reports</title>
    <style>
        body {
            font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
            background: #0f1116;
            color: #e8e8e8;
            max-width: 720px;
            margin: 40px auto;
            padding: 0 20px;
            line-height: 1.5;
        }
        h1 { font-size: 1.4rem; margin-bottom: 4px; }
        h1 a { color: inherit; text-decoration: none; }
        .subtitle { color: #9aa0a6; margin-top: 0; margin-bottom: 28px; font-size: 0.95rem; }
        form { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
        input[type=text] {
            flex: 1; min-width: 220px; padding: 10px 12px; border-radius: 8px;
            border: 1px solid #3a3d45; background: #1b1d24; color: #e8e8e8; font-size: 1rem;
        }
        select {
            padding: 10px 12px; border-radius: 8px; border: 1px solid #3a3d45;
            background: #1b1d24; color: #e8e8e8; font-size: 0.95rem;
        }
        button {
            padding: 10px 18px; border-radius: 8px; border: none;
            background: #4c8bf5; color: white; font-size: 1rem; cursor: pointer;
        }
        button:hover { background: #3d78e0; }
        .card {
            background: #1b1d24; border: 1px solid #2a2d35; border-radius: 12px;
            padding: 24px 28px;
        }
        .card h1 { margin-top: 0; }
        .card h2 { font-size: 1.05rem; color: #9dc0ff; margin-top: 22px; margin-bottom: 6px; }
        .card hr { border: none; border-top: 1px solid #2a2d35; margin: 20px 0 12px; }
        .card em { color: #9aa0a6; font-size: 0.85rem; }
        ul.results { list-style: none; padding: 0; }
        ul.results li { margin-bottom: 6px; }
        ul.results a {
            display: block; padding: 10px 14px; background: #1b1d24; border: 1px solid #2a2d35;
            border-radius: 8px; color: #e8e8e8; text-decoration: none;
        }
        ul.results a:hover { border-color: #4c8bf5; }
        .back-link { display: inline-block; margin-top: 20px; color: #9dc0ff; text-decoration: none; }
        .error { color: #f28b82; }
    </style>
</head>
<body>
    <h1><a href="/">Scouting Reports</a></h1>
    <p class="subtitle">Premier League, 2024-2025</p>
    {% block content %}{% endblock %}
</body>
</html>
