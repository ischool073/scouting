# Single source of truth for in-scope competitions.
# fbref_source: which package reads this competition's FBref stats ("soccerdata" for
#   top flight, "fbrefdata" for 2nd tier, null where no free advanced-stats source exists (3rd tier)).
# fbref_key: the league identifier string passed to that package's FBref(leagues=[...]) call.
# transfermarkt_competition_id: competition id in the dcaribou/transfermarkt-datasets dataset.
# understat_key: league identifier for soccerdata.Understat(leagues=[...]); null where Understat
#   has no coverage (all 2nd/3rd tiers).
# sofascore_tournament_id: SofaScore's internal tournament id, used to hit their statistics API
#   directly (see ingest/sofascore_ingest.py). Only verified for ENG1 so far -- null elsewhere
#   until confirmed the same way (fetch /api/v1/unique-tournament/{id}/seasons and check the name).
#
# NOTE: fbref_key / transfermarkt_competition_id values below are best-effort based on each
# project's documented naming conventions. Verify each one against the live package/dataset
# during Stage 1-3 ingestion and correct here if a key doesn't resolve -- this file is the
# only place that needs fixing.

leagues:
  # --- England ---
  - id: ENG1
    country: England
    tier: 1
    display_name: "Premier League"
    fbref_source: soccerdata
    fbref_key: "ENG-Premier League"
    transfermarkt_competition_id: "GB1"
    understat_key: "ENG-Premier League"
    sofascore_tournament_id: 17
